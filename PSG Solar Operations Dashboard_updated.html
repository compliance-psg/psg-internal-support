        /* Dark theme: #071C25 ground · #0C2E3C boxes · #F2A900 accent */
        body {
            background-color: #071C25;
            color: #EAF0F2;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .psg { font-feature-settings: "tnum" 1; }
        .psg .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #93A9B2; font-weight: 600; }
        .psg .it { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500; }
        .psg .fade { animation: fadeUp .35s cubic-bezier(.22,1,.36,1) both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        /* Tab changes: content slides in from the direction of travel */
        .psg .slide-r { animation: slideR .32s cubic-bezier(.22,1,.36,1) both; }
        .psg .slide-l { animation: slideL .32s cubic-bezier(.22,1,.36,1) both; }
        @keyframes slideR { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
        @keyframes slideL { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
        /* Amber underline glides under the active tab */
        .psg .tab-ind { transition: left .3s cubic-bezier(.22,1,.36,1), width .3s cubic-bezier(.22,1,.36,1); }
        @media (prefers-reduced-motion: reduce) { .psg .fade, .psg .slide-r, .psg .slide-l { animation: none; } .psg .tab-ind { transition: none; } }

        .psg .trow { border-bottom: 1px solid #31495A; cursor: pointer; transition: background .15s; }
        .psg .trow:hover { background: rgba(242,169,0,.07); }
        .psg button:focus-visible, .psg tr:focus-visible, .psg input:focus-visible, .psg select:focus-visible, .psg a:focus-visible {
            outline: 2px solid #F2A900;
            outline-offset: 2px;
        }
        .psg .seg { transition: background .15s, color .15s; }
        .psg .seg:hover { color: #EAF0F2; }
        .psg input::placeholder { color: #7E96A0; }
        .psg .btnp { transition: background .15s; }
        .psg .btnp:hover { background: #D99600; }
        .psg .btng { transition: border-color .15s; }
        .psg .btng:hover { border-color: #93A9B2; }
        .psg .hbd { transition: border-color .15s; }
        .psg .hbd:hover { border-color: rgba(234,240,242,0.55); }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #071C25; }
        ::-webkit-scrollbar-thumb { background: #31495A; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4A6478; }

        .cell { transition: transform .12s, outline-color .12s; }
        .cell:hover { transform: scale(1.2); outline: 1px solid #EAF0F2; z-index: 10; }

        /* Custom Native Select styling */
        .psg-select {
            background-color: #071C25;
            border: 1px solid #31495A;
            color: #EAF0F2;
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            outline: none;
        }
        .psg-select:focus { border-color: #F2A900; }

        /* ---- Tab 5: Heat Map ---- */
        function heatColor(v, max) {
            if (!v) return 'rgba(147,169,178,0.10)';
            const r = v / Math.max(max, 1);
            return 'rgba(242,169,0,' + (r > 0.75 ? 1 : r > 0.5 ? 0.75 : r > 0.25 ? 0.5 : 0.28) + ')';
        }

        function HeatTab({ completed, compliance, onOpen }) {
            const nowY = new Date().getFullYear();
            const [src, setSrc] = useState('completed');
            const [layout, setLayout] = useState('calendar');
            const [group, setGroup] = useState('mfr');
            const [year, setYear] = useState(nowY);
            const [sel, setSel] = useState(null);

            useEffect(() => { setGroup('mfr'); setSel(null); }, [src]);

            const recs = useMemo(() => src === 'completed' ? completed.filter(r => r.closed).map(r => ({ ...r, _d: r.closed })) : compliance.filter(r => r.updated).map(r => ({ ...r, _d: r.updated })), [src, completed, compliance]);
            const years = [...new Set([nowY, ...recs.map(r => r._d.getFullYear())])].sort((a, b) => b - a);
            const yr = recs.filter(r => r._d.getFullYear() === year);

            const byDay = useMemo(() => {
                const m = {}; yr.forEach(r => { const k = dk(r._d); (m[k] = m[k] || []).push(r); }); return m;
            }, [yr]);

            const maxDay = Math.max(1, ...Object.values(byDay).map(a => a.length));
            const gkey = r => group === 'fault' ? (r.fault || 'Not set') : group === 'sys' ? (r.sys || 'Not set') : group === 'result' ? CAT[catOf(r)].l : (r.mfr || 'Not set');

            const matrix = useMemo(() => {
                const m = {}; yr.forEach(r => { const g = gkey(r); m[g] = m[g] || { name: g, total: 0, months: Array.from({ length: 12 }, () => []) }; m[g].total++; m[g].months[r._d.getMonth()].push(r); });
                let rows = Object.values(m).sort((a, b) => b.total - a.total);
                if (rows.length > 12) {
                    const rest = rows.slice(11);
                    const o = { name: 'Other (' + rest.length + ')', total: 0, months: Array.from({ length: 12 }, () => []) };
                    rest.forEach(r => { o.total += r.total; r.months.forEach((a, i) => o.months[i].push(...a)); });
                    rows = [...rows.slice(0, 11), o];
                }
                return rows;
            }, [yr, group]);

            const maxCell = Math.max(1, ...matrix.flatMap(r => r.months.map(a => a.length)));
            const monthly = MONTHS.map((m, i) => ({ m, v: yr.filter(r => r._d.getMonth() === i).length }));
            const busiestDay = Object.entries(byDay).sort((a, b) => b[1].length - a[1].length)[0];
            const busiestMonth = [...monthly].sort((a, b) => b.v - a.v)[0];

            const jan1 = new Date(year, 0, 1);
            const offset = (jan1.getDay() + 6) % 7;
            const nDays = Math.round((new Date(year + 1, 0, 1) - jan1) / DAY);
            const cells = Array.from({ length: offset + nDays }, (_, i) => i < offset ? null : new Date(year, 0, 1 + i - offset));
            const CELL = 11, GAP = 2;
            const word = src === 'completed' ? 'completed jobs' : 'compliance updates';
            const groupOpts = src === 'completed' ? [{ v: 'mfr', l: 'Manufacturer' }, { v: 'fault', l: 'Fault type' }, { v: 'sys', l: 'System type' }] : [{ v: 'mfr', l: 'Manufacturer' }, { v: 'result', l: 'Booking status' }];

            return e('div', { className: 'space-y-5' },

                    e(Seg, { opts: [{ v: 'calendar', l: 'Calendar' }, { v: 'matrix', l: 'Month grid' }], val: layout, set: v => { setLayout(v); setSel(null); } }),
                    layout === 'matrix' ? e(Seg, { opts: groupOpts, val: group, set: v => { setGroup(v); setSel(null); } }) : null
                ),
                e('p', { className: 'text-sm', style: { color: C.muted } }, src === 'completed' ? 'Each square is a day, coloured by closed jobs count. Click a cell for details.' : 'Each square represents compliance updates per day. Click a cell for details.'),
                e(Kpis, {
                    cols: 'lg:grid-cols-3',
                    items: [
                    { l: 'Total ' + word + ', ' + year, v: yr.length, c: C.acc },
                    { l: 'Busiest day', v: busiestDay ? busiestDay[1].length : 0, n: busiestDay ? fmtS(new Date(busiestDay[0] + 'T00:00')) : 'No data' },
                    { l: 'Busiest month', v: busiestMonth && busiestMonth.v ? busiestMonth.v : 0, n: busiestMonth && busiestMonth.v ? busiestMonth.m + ' ' + year : 'No data' }
                    ]
                }),
                e(Panel, {
                    title: layout === 'calendar' ? 'Daily heat map, ' + year : 'Month grid, ' + year,
                    right: e('div', { className: 'flex items-center gap-1 text-xs', style: { color: C.muted } }, 'Less ', [0, 0.2, 0.4, 0.7, 1].map(v => e('span', { key: v, style: { width: 11, height: 11, background: heatColor(v * maxDay, maxDay), display: 'inline-block' } })), ' More')
                },
                    layout === 'calendar' ? e('div', { className: 'overflow-x-auto pb-2' },
                    e('div', { className: 'relative', style: { height: 14, width: Math.ceil(cells.length / 7) * (CELL + GAP) + 28 } },
                    MONTHS.map((m, i) => {
                    const doy = Math.round((new Date(year, i, 1) - jan1) / DAY);
                    return e('span', { key: m, className: 'absolute text-xs', style: { left: 28 + Math.floor((offset + doy) / 7) * (CELL + GAP), color: C.muted, fontSize: 10 } }, m);
                    })
                    ),
                    e('div', { className: 'flex' },
                    e('div', { className: 'flex flex-col text-xs mr-1', style: { width: 24, gap: GAP, color: C.muted, fontSize: 9 } },
                    ['Mon', '', 'Wed', '', 'Fri', '', ''].map((d, i) => e('span', { key: i, style: { height: CELL, lineHeight: CELL + 'px' } }, d))
                    ),
                    e('div', { style: { display: 'grid', gridTemplateRows: 'repeat(7,' + CELL + 'px)', gridAutoFlow: 'column', gridAutoColumns: CELL + 'px', gap: GAP } },
                    cells.map((d, i) => {
                    if (!d) return e('span', { key: i });
                    const k = dk(d);
                    const list = byDay[k] || [];
                    return e('button', {
                    key: i,
                    className: 'cell',
                    title: fmtS(d) + ': ' + list.length + ' ' + word,
                    onClick: () => setSel({ title: fmtS(d) + ', ' + year, list }),
                    style: {
                    width: CELL,
                    height: CELL,
                    background: heatColor(list.length, maxDay),
                    outline: sel && sel.title === fmtS(d) + ', ' + year ? '1px solid ' + C.text : 'none'
                    }
                    });
                    })
                    )
                    )
                    ) : e('div', { className: 'overflow-x-auto' },
                    e('table', { style: { borderCollapse: 'separate', borderSpacing: 3 } },
                    e('thead', null,
                    e('tr', null,
                    e('th', null),
                    MONTHS.map(m => e('th', { key: m, className: 'text-xs font-normal', style: { color: C.muted, fontSize: 10, width: 30 } }, m)),
                    e('th', { className: 'text-xs font-normal pl-2', style: { color: C.muted, fontSize: 10 } }, 'Total')
                    )
                    ),
                    e('tbody', null,
                    matrix.length ? matrix.map(r => e('tr', { key: r.name },
                    e('td', { className: 'text-xs pr-3 whitespace-nowrap', style: { color: C.text, maxWidth: 150, overflow: 'hidden', textOverflow: 'ellipsis' } }, r.name),
                    r.months.map((a, i) => e('td', { key: i, style: { padding: 0 } },
                    e('button', {
                    className: 'cell tabular-nums',
                    onClick: () => setSel({ title: r.name + ', ' + MONTHS[i] + ' ' + year, list: a }),
                    style: { width: 30, height: 20, fontSize: 10, background: heatColor(a.length, maxCell), color: a.length / maxCell > 0.5 ? C.dark : C.text }
                    }, a.length || '')
                    )),
                    e('td', { className: 'text-xs pl-2 tabular-nums', style: { color: C.muted } }, r.total)
                    )) : e('tr', null, e('td', { className: 'py-8 text-sm', style: { color: C.muted } }, 'No records in ' + year))
                    )
                    )
                    )
                ),
                sel ? e(Panel, {
                    title: sel.title,
                    hint: sel.list.length + ' ' + word,
                    right: e('button', { onClick: () => setSel(null), className: 'btng text-xs px-3.5 py-1.5 rounded-full', style: { border: '1px solid ' + C.line, color: C.muted } }, 'Clear')
                },
                    e(Table, {
                    minW: 560,
                    rows: [...sel.list].sort((a, b) => b._d - a._d),
                    onRow: r => onOpen({ type: src === 'completed' ? 'completed' : 'compliance', rec: r }),
                    empty: 'No records here.',
                    cols: src === 'completed' ? [
                    { k: 'ticket', l: 'Ticket', r: r => e('span', { style: { color: C.acc } }, r.ticket || '—') }, { k: 'name', l: 'Customer' }, { k: 'mfr', l: 'Manufacturer' }, { k: 'fault', l: 'Fault' }, { k: 'closed', l: 'Completed', r: r => fmtD(r.closed) }
                    ] : [
                    { k: 'ticket', l: 'Ticket', r: r => e('span', { style: { color: C.acc } }, r.ticket || '—') }, { k: 'name', l: 'Customer' }, { k: 'mfr', l: 'Manufacturer' }, { k: 'cat', l: 'Status', r: r => e(Tag, { c: CAT[catOf(r)].c }, CAT[catOf(r)].l) }, { k: 'updated', l: 'Updated', r: r => fmtS(r.updated) + ', ' + fmtT(r.updated) }
                    ]
                    })
                ) : null,
                e(Panel, { title: 'Monthly totals, ' + year },
                    e('div', { style: { height: 200 } },
                    e(ResponsiveContainer, null,
                    e(BarChart, { data: monthly, margin: { left: -20, right: 8, top: 8 } },
                    e(CartesianGrid, { stroke: C.line, vertical: false }),
                    e(XAxis, Object.assign({ dataKey: 'm' }, axisStyle)),
                    e(YAxis, Object.assign({ allowDecimals: false }, axisStyle)),
                    e(Tooltip, tipStyle),
                    e(Bar, { dataKey: 'v', name: word, fill: C.acc, className: 'bar-acc', barSize: 18, radius: [2, 2, 0, 0], animationDuration: 900 })
                    )
                    )
                    )
                )
            );
        }

        /* ---- Detail Drawer ---- */
        function Drawer({ d, onClose }) {
            if (!d) return null;
            const r = d.rec;
            const Row = ({ l, v }) => e('div', { className: 'flex justify-between gap-4 py-2.5 text-sm', style: { borderBottom: '1px solid ' + C.line } },
                e('span', { style: { color: C.muted } }, l),
                e('span', { className: 'text-right', style: { color: C.text, overflowWrap: 'anywhere' } }, v || '—')
            );
            const Block = ({ l, v }) => v ? e('div', { className: 'mt-4' },
                e('div', { className: 'lbl mb-1' }, l),
                e('p', { className: 'text-sm leading-relaxed', style: { color: C.text, whiteSpace: 'pre-wrap' } }, v)
            ) : null;

            return e('div', { className: 'fixed inset-0 z-50 flex justify-end' },
                e('button', { 'aria-label': 'Close', onClick: onClose, className: 'absolute inset-0 w-full h-full', style: { background: 'rgba(4,14,19,0.72)' } }),
                e('aside', { className: 'relative w-full max-w-md h-full overflow-y-auto p-6 fade', style: { background: C.panel, borderLeft: '1px solid ' + C.line } },
                    e('div', { className: 'flex justify-between items-start gap-4' },
                    e('div', null,
                    e('div', { className: 'lbl' }, (d.type === 'compliance' ? 'Compliance check' : d.type === 'open' ? 'Open job' : 'Completed job') + ' · ' + (r.ticket || 'No ticket')),
                    e('h2', { className: 'text-2xl font-semibold mt-1' }, r.name)
                    ),
                    e('button', { onClick: onClose, className: 'btng px-3 py-1 text-sm rounded-full', style: { border: '1px solid ' + C.line, color: C.muted } }, 'Esc')
                    ),
                    d.type === 'compliance' ? e(React.Fragment, null,
                    e('div', { className: 'mt-5 p-4 rounded-lg', style: { border: '1px solid ' + CAT[catOf(r)].c } },
                    e(Tag, { c: CAT[catOf(r)].c }, CAT[catOf(r)].l),
                    e('p', { className: 'text-base mt-2', style: { color: C.text } }, verdict(r))
                    ),
                    e('div', { className: 'mt-4' },
                    e(Row, { l: 'Manufacturer', v: r.mfr }),
                    e(Row, { l: 'SLD required', v: r.sldReq ? (r.sldReq === 'yes' ? 'Yes' : 'No') : 'Blank' }),
                    e(Row, { l: 'SLD done', v: r.sldDone ? 'Yes' : 'No' }),
                    e(Row, { l: 'Compliance check done', v: r.cc ? 'Yes' : 'No' }),
                    e(Row, { l: 'Last updated', v: r.updated ? fmtD(r.updated) + ', ' + fmtT(r.updated) + ' (' + ago(r.updated) + ')' : 'Before tracking started' })
                    ),
                    e(Block, { l: 'Notes', v: r.notes })
                    ) : null,
                    d.type === 'open' ? e(React.Fragment, null,
                    e('div', { className: 'mt-5' },
                    e(Stepper, { stage: stageOf(r) }),
                    e('div', { className: 'text-xs mt-2', style: { color: C.acc } }, 'Step ' + (stageOf(r) + 1) + ': ' + STAGES[stageOf(r)])
                    ),
                    e('div', { className: 'mt-4' },
                    e(Row, { l: 'Status', v: r.status || 'No status yet' }),
                    e(Row, { l: 'System', v: r.sys }),
                    e(Row, { l: 'Manufacturer', v: r.mfr }),
                    e(Row, { l: 'Fault with', v: r.fault }),
                    e(Row, { l: 'Logged', v: fmtD(r.logged) }),
                    e(Row, { l: 'Last update', v: r.updated ? fmtD(r.updated) + ' (' + ago(r.updated) + ')' : '' }),
                    e(Row, { l: 'Warranty lodged / RMA', v: r.wl }),
                    e(Row, { l: 'Warranty reference', v: r.wr }),
                    e(Row, { l: 'Technician', v: r.tech }),
                    e(Row, { l: 'Technician visit', v: r.techVisit })
                    ),
                    e(Block, { l: 'Summary of fault', v: r.summary }),
                    e(Block, { l: 'Action / notes', v: r.notes })
                    ) : null,
                    d.type === 'completed' ? e(React.Fragment, null,
                    e('div', { className: 'mt-4' },
                    e(Row, { l: 'System', v: r.sys }),
                    e(Row, { l: 'Manufacturer', v: r.mfr }),
                    e(Row, { l: 'Fault with', v: r.fault }),
                    e(Row, { l: 'Logged', v: fmtD(r.logged) }),
                    e(Row, { l: 'Completed', v: fmtD(r.closed) }),
                    e(Row, { l: 'Days open', v: r.logged && r.closed && r.closed >= r.logged ? String(Math.round((r.closed - r.logged) / DAY)) : '' }),
                    e(Row, { l: 'Technician', v: r.tech })
                    ),
                    e(Block, { l: 'Summary of fault', v: r.summary }),
                    e(Block, { l: 'Action / notes', v: r.notes })
                    ) : null
                )
            );
        }

        /* ---- Main Application Component ---- */
        const TABS = ['Tech Support', 'Compliance & Booking', 'SLD', 'RMA Timeline', 'Heat Map'];

        function App() {
            const [tab, setTabRaw] = useState(0);
            const [dir, setDir] = useState(1);
            const [ind, setInd] = useState(null);
            const tabRef = useRef(0);
            const btnRefs = useRef([]);
            const setTab = i => { setDir(i >= tabRef.current ? 1 : -1); tabRef.current = i; setTabRaw(i); };
            const [open, setOpen] = useState(snapOpen);
            const [completed, setCompleted] = useState(snapCompleted);
            const [cc, setCc] = useState(snapCC);
            const [sync, setSync] = useState({ state: 'loading', live: [], at: null });
            const [drawer, setDrawer] = useState(null);
            const [win, setWin] = useState(14);
            const [toastMsg, setToastMsg] = useState('');
            const searchRef = useRef(null);

            const toast = useCallback(m => {
                setToastMsg(m);
                setTimeout(() => setToastMsg(''), 2200);
            }, []);

            const load = useCallback(async (manual) => {
                setSync(s => ({ ...s, state: 'loading' }));
                const base = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq';
                // Method 1: CSV via fetch
                const viaCSV = async (gid) => {
                    const r = await fetch(base + '?tqx=out:csv&headers=1&gid=' + gid + '&cb=' + Date.now(), { cache: 'no-store' });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const t = await r.text();
                    if (t.trim().startsWith('<')) throw new Error('not csv');
                    return parseCSV(t);
                };
                // Method 2: JSONP script tag (no CORS needed; works from file:// and strict browsers)
                const viaJSONP = (gid) => new Promise((resolve, reject) => {
                    const cb = '__psg_' + gid + '_' + Date.now();
                    const s = document.createElement('script');
                    const done = () => { try { delete window[cb]; } catch (_) { window[cb] = undefined; } s.remove(); clearTimeout(to); };
                    const to = setTimeout(() => { done(); reject(new Error('timeout')); }, 20000);
                    window[cb] = (resp) => {
                    done();
                    if (!resp || resp.status === 'error' || !resp.table) return reject(new Error('gviz error'));
                    const cell = c => (c == null ? '' : c.f != null ? String(c.f) : c.v == null ? '' : typeof c.v === 'boolean' ? (c.v ? 'TRUE' : 'FALSE') : String(c.v));
                    const head = resp.table.cols.map(c => c.label || '');
                    const body = resp.table.rows.map(r => (r.c || []).map(cell));
                    resolve([head].concat(body));
                    };
                    s.onerror = () => { done(); reject(new Error('script blocked')); };
                    s.src = base + '?tqx=out:json;responseHandler:' + cb + '&headers=1&gid=' + gid + '&cb=' + Date.now();
                    document.head.appendChild(s);
                });
                const get = async (gid, parse) => {
                    let rows;
                    try { rows = await viaCSV(gid); } catch (err) { rows = await viaJSONP(gid); }
                    const out = parse(rows);
                    if (!out.length) throw new Error('empty');
                    return out;
                };

                const res = await Promise.allSettled([
                    get(GID.open, liveOpen),
                    get(GID.completed, liveCompleted),
                    get(GID.compliance, liveCC)
                ]);

                const live = [];
                if (res[0].status === 'fulfilled') { setOpen(res[0].value); live.push('Open Jobs'); }
                if (res[1].status === 'fulfilled') { setCompleted(res[1].value); live.push('Completed Jobs'); }
                if (res[2].status === 'fulfilled') { setCc(res[2].value); live.push('Compliance Check'); }

                setSync({ state: live.length === 3 ? 'live' : live.length ? 'partial' : 'snapshot', live, at: new Date() });
                if (manual) toast(live.length ? 'Refreshed from Google Sheet' : 'Sheet unreachable, showing 5 Nov snapshot');
            }, [toast]);

            useEffect(() => {
                load();
                const t = setInterval(() => load(), 60000);
                return () => clearInterval(t);
            }, [load]);

            useEffect(() => {
                const h = ev => {
                    const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement && document.activeElement.tagName);
                    if (ev.key === 'Escape') { setDrawer(null); if (typing) document.activeElement.blur(); return; }
                    if (typing) return;
                    if (/^[1-5]$/.test(ev.key)) setTab(+ev.key - 1);
                    else if (ev.key === '/') { ev.preventDefault(); setTab(1); setTimeout(() => searchRef.current && searchRef.current.focus(), 60); }
                    else if (ev.key.toLowerCase() === 'r') load(true);
                };
                window.addEventListener('keydown', h);
                return () => window.removeEventListener('keydown', h);
            }, [load]);

            /* Sliding tab underline: measure the active tab button */
            useEffect(() => {
                const upd = () => { const el = btnRefs.current[tabRef.current]; if (el) setInd({ left: el.offsetLeft, width: el.offsetWidth }); };
                upd();
                window.addEventListener('resize', upd);
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(upd);
                return () => window.removeEventListener('resize', upd);
            }, [tab]);

            const badge = { live: { c: '#5BC9AF', l: 'LIVE' }, partial: { c: C.acc, l: 'PARTLY LIVE' }, snapshot: { c: C.acc, l: 'SNAPSHOT' }, loading: { c: C.onDarkMuted, l: 'SYNCING' } }[sync.state];
            const pendingCount = cc.filter(r => !r.cc).length;

            return e('div', { className: 'min-h-screen' },
                e('div', { className: 'sticky top-0 z-40' },
                    e('header', { style: { background: C.dark, borderBottom: '1px solid rgba(234,240,242,0.08)' } },
                        e('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3' },
                            e(Logo, null),
                            e('div', { className: 'flex flex-wrap items-center gap-2' },
                                e('span', { className: 'inline-flex items-center gap-2 px-2.5 py-1 text-xs font-semibold tracking-widest rounded-full', style: { color: badge.c, border: '1px solid rgba(234,240,242,0.22)' } },
                                    e(Dot, { c: badge.c }),
                                    badge.l
                                ),
                                sync.at && e('span', { className: 'text-xs hidden sm:inline', style: { color: C.onDarkMuted }, title: sync.live.length ? 'Live tabs: ' + sync.live.join(', ') : 'Could not reach Google Sheet' },
                                    'Synced ' + sync.at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                                ),
                                e('button', { onClick: () => load(true), className: 'hbd px-3.5 py-1.5 text-xs rounded-full', style: { border: '1px solid rgba(234,240,242,0.25)', color: C.onDark } },
                                    e(Icon, { n: 'refresh', spin: sync.state === 'loading', className: 'mr-1.5' }),
                                    'Refresh'
                                ),
                                e('a', { href: SHEET_LINK, target: '_blank', rel: 'noopener noreferrer', className: 'btnp px-3.5 py-1.5 text-xs font-semibold rounded-full', style: { background: C.acc, color: C.dark } },
                                    'Open sheet ',
                                    e(Icon, { n: 'external', className: 'ml-1' })
                                )
                            )
                        )
                    ),
                    e('nav', { style: { background: C.panel, borderBottom: '1px solid ' + C.line } },
                        e('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 flex overflow-x-auto relative' },
                            TABS.map((t, i) => e('button', {
                                key: t,
                                onClick: () => setTab(i),
                                className: 'px-4 py-3.5 text-sm whitespace-nowrap flex items-center gap-2',
                                style: {
                                    color: tab === i ? C.text : C.muted,
                                    fontWeight: tab === i ? 600 : 400,
                                    borderBottom: '2px solid ' + (tab === i ? C.acc : 'transparent'),
                                    transition: 'color .15s, border-color .2s'
                                }
                            },
                                e('span', { className: 'text-xs tabular-nums', style: { color: C.muted } }, i + 1),
                                t,
                                i === 1 && pendingCount > 0 ? e('span', { className: 'text-xs px-1.5 rounded-full tabular-nums', style: { background: C.red, color: '#FFFFFF' } }, pendingCount) : null
                            ))
                        )
                    )
                ),
                sync.state !== 'live' && sync.state !== 'loading' ? e('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 mt-4' },
                    e('div', { className: 'px-4 py-2.5 text-sm rounded-lg', style: { border: '1px solid ' + C.acc, background: 'rgba(242,169,0,0.08)', color: C.text } },
                        e('span', { className: 'mr-2', style: { color: C.acc } }, e(Icon, { n: 'warn' })),
                        sync.state === 'snapshot' ? 'Could not reach the live sheet. Showing static snapshot data.' : 'Live connection active for: ' + sync.live.join(', ') + '. Other tabs using snapshot data.'
                    )
                ) : null,
                e('main', { key: tab, className: 'max-w-7xl mx-auto px-4 sm:px-6 py-6 fade' },
                    tab === 0 ? e(TechTab, { open, completed, onOpen: setDrawer }) : null,
                    tab === 1 ? e(ComplianceTab, { rows: cc, win, setWin, onOpen: setDrawer, searchRef, toast }) : null,
                    tab === 2 ? e(SldTab, { rows: cc, win, setWin, onOpen: setDrawer }) : null,
                    tab === 3 ? e(RmaTab, { open, onOpen: setDrawer }) : null,
                    tab === 4 ? e(HeatTab, { completed, compliance: cc, onOpen: setDrawer }) : null
                ),
                e('footer', { className: 'max-w-7xl mx-auto px-4 sm:px-6 pb-8 flex flex-wrap justify-between gap-3 text-xs', style: { color: C.muted, borderTop: '1px solid ' + C.line, marginTop: 20, paddingTop: 14 } },
                    e('span', null, 'Read-only · Open Jobs, Completed Jobs and Compliance Check · Refreshes every 60 s' + (sync.at ? ' · Last sync ' + fmtT(sync.at) : '')),
                    e('span', null, 'Shortcuts: 1–5 tabs · / search queue · R refresh · Esc close')
                ),
                e(Drawer, { d: drawer, onClose: () => setDrawer(null) }),
                toastMsg ? e('div', { className: 'fixed bottom-5 left-1/2 z-50 px-4 py-2 text-sm rounded-full fade', style: { transform: 'translateX(-50%)', background: C.acc, color: C.dark } }, toastMsg) : null
            );
        }

        // Initialize and Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
